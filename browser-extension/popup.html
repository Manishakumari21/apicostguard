<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #0a0e1a;
      color: #94a3b8;
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 800;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 span { color: #818cf8; }
    .status {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .status.active { background: rgba(52,211,153,0.12); color: #34d399; }
    .status.off { background: rgba(248,113,113,0.12); color: #f87171; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: #1e293b;
    }
    .stat {
      background: #111827;
      padding: 14px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
      font-variant-numeric: tabular-nums;
    }

    .section {
      padding: 14px 20px;
      border-bottom: 1px solid #1e293b;
    }
    .section h2 {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .model-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
    }
    .model-name {
      font-size: 12px;
      color: #94a3b8;
      font-family: "SF Mono", monospace;
    }
    .model-cost {
      font-size: 12px;
      color: #818cf8;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .model-reqs {
      font-size: 11px;
      color: #64748b;
    }

    .log-entry {
      padding: 8px 0;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .log-dot.openai { background: #10b981; }
    .log-dot.anthropic { background: #f59e0b; }
    .log-dot.google { background: #3b82f6; }
    .log-dot.unknown { background: #6b7280; }
    .log-info { flex: 1; min-width: 0; }
    .log-model {
      font-size: 12px;
      color: #f1f5f9;
      font-weight: 500;
    }
    .log-meta {
      font-size: 11px;
      color: #64748b;
    }
    .log-cost {
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      text-align: center;
      padding: 24px;
      color: #64748b;
      font-size: 12px;
    }

    .footer {
      padding: 12px 20px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #111827;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn:hover { background: #1a2235; color: #f1f5f9; border-color: #273449; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span>&#9670;</span> Cost Guard</h1>
    <span class="status active" id="status">Monitoring</span>
  </div>

  <div class="stats-grid">
    <div class="stat">
      <div class="stat-label">Requests</div>
      <div class="stat-value" id="total-requests">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Tokens</div>
      <div class="stat-value" id="total-tokens">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Cost</div>
      <div class="stat-value" id="total-cost">$0.00</div>
    </div>
  </div>

  <div class="section" id="models-section">
    <h2>Models Used</h2>
    <div id="models-list"><div class="empty">No data yet. Use ChatGPT, Claude, or Gemini.</div></div>
  </div>

  <div class="section" id="recent-section">
    <h2>Recent Activity</h2>
    <div id="recent-list"><div class="empty">Waiting for activity...</div></div>
  </div>

  <div class="footer">
    <button class="btn" id="clear-btn">Clear Data</button>
    <button class="btn" id="refresh-btn">Refresh</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
