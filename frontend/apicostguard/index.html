<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F14" />
    <meta
      name="description"
      content="APICostGuard — monitor AI API usage and costs across providers, budgets, and projects."
    />
    <title>APICostGuard · AI Usage & Cost Monitor</title>
    <script>
      (function () {
        var theme = localStorage.getItem("apicostguard_theme") || "dark";
        var dark = theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: light)").matches !== true);
        document.documentElement.classList.toggle("theme-dark", dark);
        document.documentElement.classList.toggle("theme-light", !dark);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
