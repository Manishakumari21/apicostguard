[package]
name = "apicostguard_backend"
version = "0.1.0"
edition = "2021"
description = "API CostGuard backend - local gateway, usage tracking, and cost/budget engine for AI provider APIs"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "limit", "timeout", "request-id", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
subtle = "2"

rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

keyring = { version = "3", features = ["apple-native", "windows-native"] }
aes-gcm = "0.10"
base64 = "0.21"
uuid = { version = "1", features = ["v4", "v7"] }
async-trait = "0.1"
notify-rust = "4"

[dependencies.reqwest]
version = "0.11"
default-features = false
features = ["json", "rustls-tls"]

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0